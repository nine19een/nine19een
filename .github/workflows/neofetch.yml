name: Update profile images

on:
  schedule:
    - cron: "17 19 * * *"   # 03:17 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cards
        run: python3 scripts/build_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build section images
        run: python3 scripts/build_sections.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg scripts/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update profile images"
            git push
          fi
